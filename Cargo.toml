[package]
edition = '2024'
name = "issen-rs"
version = "0.2.0"
authors = ["prime <prime@kmc.gr.jp>"]

[dependencies]
rand = "0.10"
futures = { version = "0.3", features = ["std"] }
yaml-rust = "0.4"
parking_lot = "0.12"
clap = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" , features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.13", features = ["json"], default-features = false }
crc64 = "2"
anyhow = "1"
thiserror = "2"
arrayvec = "0.7"
num_cpus = "1"
async-recursion = "1"
dashmap = "5"
crossbeam-utils = "0.8"

[features]
default = []
slow_pext = []
